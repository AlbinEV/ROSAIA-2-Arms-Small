session_recorder:
  ros__parameters:
    output_root: "data/sessions"
    session_name: ""
    arm_names: ["arm_1", "arm_2"]
    state_topics: ["/arm_1/aruco_state", "/arm_2/aruco_state"]
    velocity_reference_topics: ["/arm_1/encoder_velocity_reference", "/arm_2/encoder_velocity_reference"]
    axis_indices: [0, 1]
    encoder_signs: [1, -1]
    maximum_telemetry_age_ms: 100.0
    flush_every_rows: 30
    motor_supply_voltage_v: 5.6
    # Negative means that the transformer/current limit is not yet measured.
    motor_supply_current_limit_a: -1.0
    motor_supply_source: "5.6 V transformer"
