shape_controller:
  ros__parameters:
    arm_names: ["arm_1", "arm_2"]
    state_topics: ["/arm_1/aruco_state", "/arm_2/aruco_state"]
    goal_topics: ["/arm_1/shape_goal", "/arm_2/shape_goal"]
    jacobian_topics: ["/arm_1/jacobian", "/arm_2/jacobian"]
    velocity_reference_topics: ["/arm_1/encoder_velocity_reference", "/arm_2/encoder_velocity_reference"]
    control_rate_hz: 50.0
    gain: 1.0
    damping: 0.01
    minimum_jacobian_norm: 0.000001
    maximum_abs_velocity: 20.0
    maximum_state_age_s: 0.15
    maximum_jacobian_age_s: 0.15
